  </g>

  <g fill="#C7D2FE" opacity=".65">
    <circle cx="176" cy="128" r="1"/>
    <circle cx="200" cy="145" r="1.3"/>
    <circle cx="226" cy="164" r="1"/>
    <circle cx="250" cy="182" r="1.3"/>
    <circle cx="280" cy="198" r="1"/>
    <circle cx="310" cy="214" r="1.2"/>
    <circle cx="340" cy="232" r="1"/>
