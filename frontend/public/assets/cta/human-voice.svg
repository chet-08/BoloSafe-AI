<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="42%" cy="50%" r="70%">
    <stop stop-color="#18235A"/>
    <stop offset=".45" stop-color="#0C1434"/>
    <stop offset="1" stop-color="#05050A"/>
  </radialGradient>

  <linearGradient id="particle" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#A5B4FC"/>
    <stop offset=".45" stop-color="#7079E0"/>
    <stop offset="1" stop-color="#5863D6"/>
  </linearGradient>

  <linearGradient id="voice" x1="0" x2="1">
    <stop stop-color="#5863D6"/>
    <stop offset=".45" stop-color="#7079E0"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="soft">
    <feGaussianBlur stdDeviation="28"/>
  </filter>

  <clipPath id="face">
    <path d="
      M160 90
      C115 120 88 170 88 226
      C88 285 105 335 142 374
      C165 398 191 413 214 421
      C224 452 247 480 275 496
      C300 510 328 505 350 487
      C370 470 381 444 384 421
      C407 407 421 383 421 357
      C438 347 452 333 454 316
      C455 299 443 284 428 275
      C450 260 458 242 452 225
      C447 210 433 201 416 196
      C427 170 426 145 412 123
      C393 94 358 76 315 72
      C264 67 203 72 160 90Z"/>
  </clipPath>
</defs>

<rect width="1200" height="620" fill="url(#bg)"/>

<circle cx="275" cy="300" r="230" fill="#5863D6" opacity=".12" filter="url(#soft)"/>
<circle cx="800" cy="300" r="280" fill="#8B5CF6" opacity=".07" filter="url(#soft)"/>

<!-- dense face particles -->
<g clip-path="url(#face)">
  <g fill="url(#particle)">
    <circle cx="110" cy="135" r="2"/>
    <circle cx="128" cy="151" r="1.5"/>
    <circle cx="145" cy="169" r="2"/>
    <circle cx="118" cy="190" r="1.4"/>
    <circle cx="140" cy="210" r="2"/>
    <circle cx="162" cy="226" r="1.5"/>
