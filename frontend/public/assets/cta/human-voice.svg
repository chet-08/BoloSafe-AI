<!-- eye -->
<circle cx="300" cy="235" r="4" fill="#C7D2FE" filter="url(#glow)"/>
<circle cx="300" cy="235" r="13" fill="#7079E0" opacity=".09"/>

<!-- profile contour -->
<path
  d="M160 90 C115 120 88 170 88 226 C88 285 105 335 142 374 C165 398 191 413 214 421"
  fill="none"
  stroke="#7079E0"
  stroke-width="2"
  opacity=".55"
/>

<!-- mouth glow -->
<circle cx="418" cy="276" r="30" fill="#5863D6" opacity=".10" filter="url(#soft)"/>
<circle cx="418" cy="276" r="3.5" fill="#A5B4FC" filter="url(#glow)"/>

