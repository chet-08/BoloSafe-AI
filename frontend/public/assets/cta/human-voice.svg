    <circle cx="390" cy="371" r="1.4"/>
    <circle cx="370" cy="394" r="2"/>
    <circle cx="348" cy="416" r="1.5"/>
    <circle cx="326" cy="438" r="2"/>
    <circle cx="300" cy="458" r="1.4"/>
    <circle cx="274" cy="475" r="2"/>
    <circle cx="246" cy="487" r="1.4"/>
    <circle cx="215" cy="475" r="1.7"/>
    <circle cx="188" cy="455" r="2"/>
